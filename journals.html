<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Журналы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        Управление Риском
        <span>научный журнал</span>
      </a>
      <nav class="nav" aria-label="Основное меню">
        <a href="index.html">Главная</a>
        <a href="about.html">Об издательстве</a>
        <a class="is-active" href="journals.html">Журналы</a>
      </nav>
      <button class="avatar" type="button" aria-label="Профиль">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="page page-wide">
    <section class="journals-grid" aria-label="Список журналов">
      <a class="journal-card" href="journal.html">
        <div class="journal-cover">
          <img src="assets/cover-ur.png" alt="">
        </div>
        <div class="journal-text">
          <strong>Управление Риском</strong>
          <span></span>
          <span></span>
          <span class="short"></span>
        </div>
      </a>

      <a class="journal-card" href="journal.html">
        <div class="journal-cover is-empty" aria-hidden="true"></div>
        <div class="journal-text">
          <strong>Страховое дело</strong>
          <span></span>
          <span></span>
          <span class="short"></span>
        </div>
      </a>

      <a class="journal-card" href="journal.html">
        <div class="journal-cover is-empty" aria-hidden="true"></div>
        <div class="journal-text">
          <strong>Страховое право</strong>
          <span></span>
          <span></span>
          <span class="short"></span>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
