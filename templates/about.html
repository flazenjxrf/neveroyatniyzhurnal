{% extends "base.html" %}
{% block title %}Об издательстве{% endblock %}
{% block content %}
<main class="page page-wide">
  <section class="panel">
    <button class="panel-head" type="button" aria-expanded="true">
      <span>О нас</span>
      <span class="panel-chevron" aria-hidden="true"></span>
    </button>
    <div class="panel-body">
      <div class="placeholder-lines">
        <span></span><span></span><span></span>
      </div>
    </div>
  </section>

  <section class="panel">
    <button class="panel-head" type="button" aria-expanded="true">
      <span>Контакты</span>
      <span class="panel-chevron" aria-hidden="true"></span>
    </button>
    <div class="panel-body">
      <div class="placeholder-lines">
        <span></span><span></span><span></span>
      </div>
    </div>
  </section>

  <section class="panel panel-closed">
    <button class="panel-head" type="button" aria-expanded="false">
      <span>Авторам</span>
      <span class="panel-chevron" aria-hidden="true"></span>
    </button>
    <div class="panel-body">
      <div class="placeholder-lines">
        <span></span><span></span>
      </div>
    </div>
  </section>

  <section class="panel panel-closed">
    <button class="panel-head" type="button" aria-expanded="false">
      <span>Редакционная политика</span>
      <span class="panel-chevron" aria-hidden="true"></span>
    </button>
    <div class="panel-body">
      <div class="placeholder-lines">
        <span></span><span></span>
      </div>
    </div>
  </section>
</main>

<script>
  document.querySelectorAll(".panel-head").forEach((btn) => {
    btn.addEventListener("click", () => {
      const panel = btn.closest(".panel");
      const closed = panel.classList.toggle("panel-closed");
      btn.setAttribute("aria-expanded", String(!closed));
    });
  });
</script>
{% endblock %}
